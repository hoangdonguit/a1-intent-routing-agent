! UNVERIFIED draft reference; independent of LLM and B0
hostname R3
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.13.2/30
 no shutdown
exit
!
interface eth2
 ip address 10.0.23.2/30
 no shutdown
exit
!
interface eth3
 ip address 192.168.3.1/24
 no shutdown
exit
!
interface eth1
 ip ospf cost 10
exit
interface eth2
 ip ospf cost 10
exit
interface eth3
 ip ospf cost 10
exit
router ospf
 ospf router-id 1.1.1.3
 network 0.0.0.0/0 area 0.0.0.0
 passive-interface eth3
exit
