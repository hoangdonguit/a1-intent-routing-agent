! UNVERIFIED draft reference; independent of LLM and B0
hostname R4
service integrated-vtysh-config
!
interface eth1
 ip address 10.6.3.2/30
 no shutdown
exit
!
interface eth2
 ip address 10.6.4.1/30
 no shutdown
exit
!
interface eth3
 ip address 192.168.2.1/24
 no shutdown
exit
!
ip prefix-list EXPORT seq 100 permit 0.0.0.0/0 le 32
ip prefix-list IMPORT seq 10 permit 0.0.0.0/0 le 32
route-map IMPORT permit 10
 match ip address prefix-list IMPORT
exit
route-map EXPORT permit 10
 match ip address prefix-list EXPORT
exit
router bgp 65004
 bgp router-id 6.6.6.4
 neighbor 10.6.3.1 remote-as 65003
 neighbor 10.6.4.2 remote-as 65005
 address-family ipv4 unicast
  network 192.168.2.0/24
  neighbor 10.6.3.1 route-map EXPORT out
  neighbor 10.6.3.1 route-map IMPORT in
  neighbor 10.6.4.2 route-map EXPORT out
  neighbor 10.6.4.2 route-map IMPORT in
 exit-address-family
exit
