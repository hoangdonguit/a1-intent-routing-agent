! UNVERIFIED draft reference; independent of LLM and B0
hostname R3
service integrated-vtysh-config
!
interface eth1
 ip address 10.6.2.2/30
 no shutdown
exit
!
interface eth2
 ip address 10.6.3.1/30
 no shutdown
exit
!
ip prefix-list EXPORT seq 100 permit 0.0.0.0/0 le 32
ip prefix-list EXPORT seq 5 deny 192.168.2.0/24
ip prefix-list IMPORT seq 10 permit 0.0.0.0/0 le 32
route-map IMPORT permit 10
 match ip address prefix-list IMPORT
exit
route-map EXPORT permit 10
 match ip address prefix-list EXPORT
exit
router bgp 65003
 bgp router-id 6.6.6.3
 neighbor 10.6.2.1 remote-as 65002
 neighbor 10.6.3.2 remote-as 65004
 address-family ipv4 unicast
  neighbor 10.6.2.1 route-map EXPORT out
  neighbor 10.6.2.1 route-map IMPORT in
  neighbor 10.6.3.2 route-map EXPORT out
  neighbor 10.6.3.2 route-map IMPORT in
 exit-address-family
exit
